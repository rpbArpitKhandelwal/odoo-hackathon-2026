# Render Blueprint — deploys TransitOps as one web service + one PostgreSQL database.
# In Render: New → Blueprint → select this repo → Apply. That's it.
databases:
  - name: transitops-db
    plan: free
    databaseName: transitops
    user: transitops

services:
  - type: web
    name: transitops
    runtime: node
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate && cd ../frontend && npm install && npm run build
    startCommand: cd backend && npx prisma migrate deploy && node prisma/seed.js && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: transitops-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20"
